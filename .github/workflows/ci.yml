name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catch patch releases inside the pinned ranges
  workflow_dispatch:

# actions are pinned to commit SHAs (a moved tag can't change what runs);
# Dependabot (.github/dependabot.yml) proposes updates
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest  # the zsh parse guard forks; macOS behaves differently
            python: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Own code health
        run: aihealth scan . --fail-under 9

  # What users get from `pip install git+…`: a built wheel, not the source
  # tree. Checks the version and the package data (dashboard templates and
  # static files) from an installed copy, outside the checkout.
  wheel:
    name: wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: python -m pip wheel . --no-deps -w dist
      - name: Install into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl httpx
      - name: Check the installed copy
        working-directory: ${{ runner.temp }}
        run: |
          expected=$(grep -oP '__version__ = "\K[^"]+' "$GITHUB_WORKSPACE/src/aihealth/__init__.py")
          test "$("$RUNNER_TEMP/venv/bin/aihealth" --version)" = "aihealth $expected"
          "$RUNNER_TEMP/venv/bin/aihealth" scan "$GITHUB_WORKSPACE/src" --fail-under 9
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed.py"
